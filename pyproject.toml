[project]
name = "options-trade-analyzer"
version = "0.1.0"
description = "Multi-agent AI options trade analyzer (capstone project)"
requires-python = ">=3.12"
dependencies = [
    "finnhub-python>=2.4.29",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.9",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "streamlit>=1.65.0",
    "vollib>=1.0.11",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
